const DAL={"資訊工程學系":"資工 CS CSIE 資訊","電機工程學系":"電機 EE","電子工程學系":"電子","機械工程學系":"機械 機工 ME","土木工程學系":"土木 CE","化學工程學系":"化工 ChE","材料科學與工程學系":"材料 材科 材工 MSE","工業工程與管理學系":"工工 工管 IE 工業工程","環境工程學系":"環工 環境","航空太空工程學系":"航太 航空 太空","中國文學系":"中文","外國語文學系":"外文 外語 英文","歷史學系":"歷史","心理學系":"心理","社會學系":"社會","教育學系":"教育","法律學系":"法律 法學","政治學系":"政治","社會工作學系":"社工","大眾傳播學系":"大傳 傳播 新聞","經濟學系":"經濟","企業管理學系":"企管","會計學系":"會計","財務金融學系":"財金","國際貿易學系":"國貿 國企","資訊管理學系":"資管 MIS","觀光餐旅管理學系":"觀光 餐旅 觀餐","數學系":"數學 應數","物理學系":"物理","化學系":"化學","生命科學系":"生科 生物","護理學系":"護理","藥學系":"藥學","建築學系":"建築","工業設計學系":"工設","昆蟲學系":"昆蟲","植物病理學與微生物學系":"植病 植微 微生物","圖書資訊學系":"圖資","森林環境暨資源學系":"森林","水土保持學系":"水保"};
const CAL=[["普通物理","普物"],["普通化學","普化"],["普通生物","普生"],["普通心理","普心"],["線性代數","線代"],["資料結構","資結 DS"],["作業系統","OS"],["計算機概論","計概"],["微積分","微積 calculus"],["個體經濟","個經"],["總體經濟","總經"],["計量經濟","計量"],["有機化學","有機 有化"],["物理化學","物化"],["生物化學","生化"],["分子生物","分生"],["材料力學","材力"],["熱力學","熱力"],["流體力學","流力"],["靜力學","靜力"],["動力學","動力"],["資料庫","DB"],["人工智慧","AI"],["演算法","演算 algo"],["電路學","電路"],["電磁學","電磁"],["作業研究","作研 OR"],["空氣動力","空力"],["訊號與系統","訊號 訊系"],["土壤力學","土力"],["鋼筋混凝土","RC"],["量子力學","量子 量力"],["電動力學","電動"],["民法總則","民總"],["刑法總則","刑總"],["程式設計","程設"],["經濟學原理","經原"],["初級會計","初會"],["中級會計","中會"],["工程統計","統計"]];
const subq=(q,t)=>{let i=0;for(const ch of t){if(ch===q[i])i++;if(i===q.length)return true}return false};
function tsc(t,p){const lo=t.toLowerCase(),al=(DAL[p.d]||"").toLowerCase().split(" ");
if(al.some(a=>a===lo))return 100;if(lo.length>=2&&al.some(a=>a.startsWith(lo)))return 95;
if(CAL.some(([k,v])=>p.n.includes(k)&&v.toLowerCase().split(" ").some(a=>a===lo)))return 90;
if((p.c+p.d+p.y+p.n).toLowerCase().includes(lo))return 80;
if(t.length>=2&&subq(t,p.d))return 60;if(t.length>=2&&subq(t,p.d+p.y))return 55;if(t.length>=2&&subq(t,p.n))return 40;return 0}
function srch(q){const ts=q.replace(/\s+/g," ").trim().split(" ").map(t=>t.length>1?t.replace(/系$/,""):t).filter(Boolean);
return BANK.map((p,i)=>{let s=0;for(const t of ts){const v=tsc(t,p);if(!v)return null;s+=v}return [p,s,i]}).filter(Boolean).sort((a,b)=>b[1]-a[1]||a[2]-b[2]).filter((x,_,r)=>x[1]>=r[0][1]*.6).map(x=>x[0])}
